[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-downloader"
version = "0.4.0"
description = "Download and organize public educational resources into a structured local study library."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Nektarios Paisios" }]

dependencies = [
    "beautifulsoup4>=4.15",
    "httpx>=0.28",
    "markitdown[all]>=0.1.8",
    "pyyaml>=6.0.2",
    "typer>=0.27",
    "rich>=15.0",
    "youtube-transcript-api>=1.2",
    "yt-dlp>=2026.8",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.2"]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-cov>=6.2",
    "pytest-mock>=3.14",
    "ruff>=0.17",
    "types-PyYAML>=6.0",
]

[project.scripts]
course-downloader = "course_downloader.cli:app"

[tool.ruff]
line-length = 80
target-version = "py314"
exclude = ["src/old_course_downloader"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_return_any = true
exclude = "^src/old_course_downloader/"

[[tool.mypy.overrides]]
module = ["faster_whisper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=course_downloader",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
