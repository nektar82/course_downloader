    path: "AI/00-Foundations/Mathematics-for-Machine-Learning"
    status: "required-reference"
    why: "Use selectively to refresh linear algebra, calculus, probability and optimization rather than repeating an undergraduate mathematics sequence."
    sources:
      - type: course_page
        label: "Mathematics for Machine Learning"
        url: "https://mml-book.github.io/"
        crawl_depth: 1
        download_documents: true
        discover_youtube: false
        discover_github: false

