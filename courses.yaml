course_download_root: "CourseDownloads"

defaults:
  timestamp_minutes: 5
  paragraph_chars: 700
  languages: [en, en-US, en-GB]
  transcribe_if_no_captions: false
  whisper_model: small
  keep_fallback_audio: false
  request_delay_seconds: 0.15
  timeout: 45

courses:
